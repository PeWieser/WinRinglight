name: Windows build and test package

on:
  push:
    branches: [ 'arena/feece2ba-winringlight' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF app
        run: dotnet build WinRinglight/WinRinglight.csproj --configuration Release
      - name: Check glow geometry on Windows
        run: dotnet run --project tools/GlowCheck/GlowCheck.csproj --configuration Release
      - name: Run desktop integration smoke test (if interactive desktop available)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $stdout = "$env:RUNNER_TEMP/smoke-out.log"
          $stderr = "$env:RUNNER_TEMP/smoke-err.log"
          $process = Start-Process dotnet -ArgumentList @('run', '--project', 'tools/IntegrationSmoke/IntegrationSmoke.csproj', '--configuration', 'Release') -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $finished = $process.WaitForExit(360000)
          if (-not $finished) { taskkill /PID $process.Id /T /F | Out-Null }
          $lines = @()
          if (Test-Path $stdout) { $lines += Get-Content $stdout }
          if (Test-Path $stderr) { $lines += Get-Content $stderr }
          $lines | ForEach-Object { Write-Output $_ }
          $summary = ($lines | Where-Object { $_ -match '^(PASS|PARTIAL|SKIP|FAIL):' }) -join '%0A'
          if (-not $finished) { $summary += '%0AFAIL: Desktop integration smoke test timed out.' }
          Write-Output "::notice::$summary"
          if (-not $finished -or $process.ExitCode -ne 0) { exit 1 }
      - name: Publish portable x64 app
        run: dotnet publish WinRinglight/WinRinglight.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64
      - name: Upload Windows test version
        uses: actions/upload-artifact@v4
        with:
          name: WinRinglight-test-win-x64
          path: publish/win-x64/
          if-no-files-found: error

  composition-prototype:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Composition prototype
        run: dotnet build tools/CompositionPrototype/CompositionPrototype.csproj --configuration Release
      - name: Publish Composition prototype
        run: dotnet publish tools/CompositionPrototype/CompositionPrototype.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o publish/composition-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: WinRinglight-Composition-Prototype-win-x64
          path: publish/composition-win-x64/
          if-no-files-found: error
