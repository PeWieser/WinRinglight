name: Windows build and test package

on:
  push:
    branches: [ 'arena/feece2ba-winringlight' ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested 1.3.1 release after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF app
        run: dotnet build WinRinglight/WinRinglight.csproj --configuration Release
      - name: Check glow geometry on Windows
        run: dotnet run --project tools/GlowCheck/GlowCheck.csproj --configuration Release
      - name: Build Composition path interop probe
        run: dotnet build tools/PathInteropProbe/PathInteropProbe.csproj --configuration Release
      - name: Probe native Composition path interop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $stdout = "$env:RUNNER_TEMP/path-out.log"
          $stderr = "$env:RUNNER_TEMP/path-err.log"
          $process = Start-Process dotnet -ArgumentList @('run', '--project', 'tools/PathInteropProbe/PathInteropProbe.csproj', '--configuration', 'Release') -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $finished = $process.WaitForExit(90000)
          if (-not $finished) { taskkill /PID $process.Id /T /F | Out-Null }
          $lines = @()
          if (Test-Path $stdout) { $lines += Get-Content $stdout }
          if (Test-Path $stderr) { $lines += Get-Content $stderr }
          $lines | ForEach-Object { Write-Output $_ }
          $summary = ($lines | Where-Object { $_ -match '^(PASS|PARTIAL|SKIP|FAIL):' }) -join '%0A'
          if (-not $finished) { $summary += '%0AFAIL: Composition path probe timed out.' }
          Write-Output "::notice::$summary"
          if (-not $finished -or $process.ExitCode -ne 0) { exit 1 }
      - name: Run desktop integration smoke test (if interactive desktop available)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $stdout = "$env:RUNNER_TEMP/smoke-out.log"
          $stderr = "$env:RUNNER_TEMP/smoke-err.log"
          $process = Start-Process dotnet -ArgumentList @('run', '--project', 'tools/IntegrationSmoke/IntegrationSmoke.csproj', '--configuration', 'Release') -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $finished = $process.WaitForExit(480000)
          if (-not $finished) { taskkill /PID $process.Id /T /F | Out-Null }
          $lines = @()
          if (Test-Path $stdout) { $lines += Get-Content $stdout }
          if (Test-Path $stderr) { $lines += Get-Content $stderr }
          $lines | ForEach-Object { Write-Output $_ }
          $summary = ($lines | Where-Object { $_ -match '^(PASS|PARTIAL|SKIP|FAIL):' }) -join '%0A'
          if (-not $finished) { $summary += '%0AFAIL: Desktop integration smoke test timed out.' }
          Write-Output "::notice::$summary"
          if (-not $finished -or $process.ExitCode -ne 0) { exit 1 }
      - name: Clean before production configuration
        run: dotnet clean tools/IntegrationSmoke/IntegrationSmoke.csproj --configuration Release
      - name: Test production defaults and hidden developer controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $stdout = "$env:RUNNER_TEMP/production-out.log"
          $stderr = "$env:RUNNER_TEMP/production-err.log"
          $process = Start-Process dotnet -ArgumentList @('run', '--project', 'tools/IntegrationSmoke/IntegrationSmoke.csproj', '--configuration', 'Release', '-p:ProductionBuild=true', '--', '--production-smoke') -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $finished = $process.WaitForExit(90000)
          if (-not $finished) { taskkill /PID $process.Id /T /F | Out-Null }
          $lines = @()
          if (Test-Path $stdout) { $lines += Get-Content $stdout }
          if (Test-Path $stderr) { $lines += Get-Content $stderr }
          $lines | ForEach-Object { Write-Output $_ }
          $summary = ($lines | Where-Object { $_ -match '^(PASS|PARTIAL|SKIP|FAIL):' }) -join '%0A'
          if (-not $finished) { $summary += '%0AFAIL: Production smoke test timed out.' }
          Write-Output "::notice::$summary"
          if (-not $finished -or $process.ExitCode -ne 0) {
            $details = ($lines | Select-Object -Last 30) -join '%0A'
            Write-Output "::error::Production test failed. Exit $($process.ExitCode).%0A$details"
            exit 1
          }
      - name: Publish production x64 EXE
        run: dotnet publish WinRinglight/WinRinglight.csproj --configuration Release --runtime win-x64 --self-contained true -p:ProductionBuild=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/portable
      - name: Publish production x64 MSIX layout
        run: dotnet publish WinRinglight/WinRinglight.csproj --configuration Release --runtime win-x64 --self-contained true -p:ProductionBuild=true -p:PublishSingleFile=false -o publish/msix-layout
      - name: Build and inspect unsigned MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/portable/WinRinglight.exe release/WinRinglight.exe
          Copy-Item WinRinglight.Package/Release.appxmanifest publish/msix-layout/AppxManifest.xml
          Copy-Item -Recurse WinRinglight.Package/Images publish/msix-layout/Images
          foreach ($name in @('StoreLogo','Square150x150Logo','Square44x44Logo','Wide310x150Logo','SmallTile','LargeTile','SplashScreen')) {
            Copy-Item "publish/msix-layout/Images/$name.scale-100.png" "publish/msix-layout/Images/$name.png"
          }
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (!$makeappx) { throw 'Windows SDK MakeAppx not found.' }
          New-Item -ItemType Directory -Force publish/bundle-input, publish/bundle-output | Out-Null
          & $makeappx pack /d publish/msix-layout /p publish/bundle-input/WinRinglight-1.3.1-x64.msix /o
          if ($LASTEXITCODE -ne 0) { throw 'MSIX packaging failed.' }
          & $makeappx unpack /p publish/bundle-input/WinRinglight-1.3.1-x64.msix /d publish/msix-inspect /o
          if ($LASTEXITCODE -ne 0) { throw 'MSIX verification failed.' }
          if (!(Test-Path publish/msix-inspect/WinRinglight.exe) -or (Test-Path publish/msix-inspect/AppxSignature.p7x)) { throw 'Unexpected MSIX contents or signature.' }
          [xml]$manifest = Get-Content publish/msix-inspect/AppxManifest.xml
          if ($manifest.Package.Identity.Version -ne '1.3.1.0' -or $manifest.Package.Identity.ProcessorArchitecture -ne 'x64') { throw 'Unexpected MSIX identity.' }
          & $makeappx bundle /d publish/bundle-input /p publish/bundle-output/WinRinglight-1.3.1-x64-unsigned.msixbundle /bv 1.3.1.0 /o
          if ($LASTEXITCODE -ne 0) { throw 'MSIX bundle creation failed.' }
          & $makeappx unbundle /p publish/bundle-output/WinRinglight-1.3.1-x64-unsigned.msixbundle /d publish/bundle-inspect /o
          if ($LASTEXITCODE -ne 0) { throw 'MSIX bundle verification failed.' }
          $packages = @(Get-ChildItem publish/bundle-inspect -Recurse -File -Filter *.msix)
          if ($packages.Count -ne 1) { throw "Unexpected MSIX bundle package count: $($packages.Count)." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path publish/bundle-output/WinRinglight-1.3.1-x64-unsigned.msixbundle).Path)
          try {
            if ($zip.GetEntry('AppxSignature.p7x') -or !$zip.GetEntry('AppxMetadata/AppxBundleManifest.xml')) { throw 'Unexpected bundle signature or missing bundle manifest.' }
          } finally { $zip.Dispose() }
          Write-Output 'PASS: unsigned x64 MSIX bundle unpacks to one production package with the expected identity.'
      - name: Smoke-test both published executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($exe in @('release/WinRinglight.exe', 'publish/msix-inspect/WinRinglight.exe')) {
            $err = Join-Path $env:RUNNER_TEMP 'release-start-stderr.txt'
            $out = Join-Path $env:RUNNER_TEMP 'release-start-stdout.txt'
            try {
              $p = Start-Process -FilePath (Resolve-Path $exe).Path -WorkingDirectory (Split-Path (Resolve-Path $exe).Path) -PassThru -RedirectStandardError $err -RedirectStandardOutput $out
              try {
                if ($p.WaitForExit(5000)) { throw "Published executable exited prematurely: $exe (exit $($p.ExitCode))." }
              } finally {
                if (!$p.HasExited) { Stop-Process -Id $p.Id -Force; $p.WaitForExit() }
              }
            } catch {
              $detail = @($_.ToString())
              if (Test-Path $err) { $detail += Get-Content $err }
              if (Test-Path $out) { $detail += Get-Content $out }
              Write-Output ("::error::" + (($detail | Select-Object -Last 30) -join '%0A'))
              exit 1
            }
          }
          Write-Output 'PASS: portable executable and unpacked MSIX executable both stayed running.'
      - name: Upload production EXE
        uses: actions/upload-artifact@v4
        with:
          name: WinRinglight-1.3.1-release-x64
          path: release/WinRinglight.exe
          if-no-files-found: error
      - name: Upload unsigned MSIX bundle (workflow artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: WinRinglight-1.3.1-MSIXBundle-x64-unsigned
          path: publish/bundle-output/WinRinglight-1.3.1-x64-unsigned.msixbundle
          if-no-files-found: error

  composition-prototype:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Composition prototype
        run: dotnet build tools/CompositionPrototype/CompositionPrototype.csproj --configuration Release
      - name: Publish Composition prototype
        run: dotnet publish tools/CompositionPrototype/CompositionPrototype.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o publish/composition-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: WinRinglight-Composition-Prototype-win-x64
          path: publish/composition-win-x64/
          if-no-files-found: error

  publish-release:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish WinRinglight 1.3.1'))
    needs: [build, composition-prototype]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WinRinglight-1.3.1-release-x64
          path: release
      - name: Publish release from tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f release/WinRinglight.exe
          gh release create v1.3.1 release/WinRinglight.exe --target "$GITHUB_SHA" --title "WinRinglight 1.3.1" --notes-file docs/RELEASE-1.3.1.md
          assets=$(gh release view v1.3.1 --json isDraft,isPrerelease,assets --jq 'if .isDraft or .isPrerelease then "invalid" else [.assets[].name] | sort | join(",") end')
          test "$assets" = "WinRinglight.exe"
          gh release delete v1.3.0 --yes
